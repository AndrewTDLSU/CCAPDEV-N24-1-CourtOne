
<!DOCTYPE html>
<html>
<head>
    <title>CourtOne Payment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="customCSS/payment.css">
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="browseVenues.html">Venues</a>
        <a href="chat.html">Chat</a>
    </nav>

    <main>
        <h1>Payment</h1>

        <form onsubmit="payNow(event)">

            <div class="payment-layout">

                <div>
                    <section class="box">
                        <h2>Payment Method</h2>

                        <label>
                            <input type="radio" name="payment"
                                   value="GCash" onclick="toggleCard()">
                            GCash
                        </label>

                        <label>
                            <input type="radio" name="payment"
                                   id="card" value="Card"
                                   onclick="toggleCard()">
                            Credit/Debit
                        </label>
                    </section>

                    <section class="box">
                        <h2>Billing Information</h2>

                        <label>Full Name</label>
                        <input type="text" id="fullName" required>

                        <label>Email Address</label>
                        <input type="email" id="email" required>

                        <div id="cardFields" hidden>
                            <p>Demo only. Do not enter real card details.</p>

                            <label>Card Number</label>
                            <input type="text" id="cardNumber">

                            <label>CVN</label>
                            <input type="text" id="cvn">

                            <label>Expiry Date</label>
                            <input type="text" id="expiry" placeholder="MM/YY">
                        </div>
                    </section>
                </div>

                <div>
                    <section class="box">
                        <h2>Order Summary</h2>

                        <p>Araneta Coliseum</p>
                        <p>Court 1</p>
                        <p>2:00 PM - 3:00 PM</p>

                        <hr>

                        <h3>Total: ₱200.00</h3>
                    </section>

                    <button type="submit">Pay Now (Demo)</button>

                    <p id="message" role="status"></p>
                </div>

            </div>
        </form>
    </main>

    <script src="customScripts/payment.js"></script>

</body>
</html>
