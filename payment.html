<!DOCTYPE html>
<html>
<head>
    <title>Payment - CourtOne</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="customCSS/payment.css">
</head>
<body>

    <nav class="payment-nav">
        <h2>CourtOne</h2>
        <div>
            <a href="index.html">Home</a>
            <a href="browseVenues.html">Venues</a>
            <a href="chat.html">Chat</a>
        </div>
    </nav>

    <main class="payment-container">
        <h1>Checkout</h1>

        <form id="paymentForm">
            <div class="payment-layout">

                
                <div>
                    <section class="payment-section">
                        <h2>Payment Method</h2>

                        <label>
                            <input type="radio" name="payment" value="GCash">
                            GCash
                        </label>

                        <label>
                            <input type="radio" name="payment" value="Card">
                            Credit / Debit
                        </label>
                    </section>

                    <section class="payment-section">
                        <h2>Billing Information</h2>

                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" required>

                        <label for="email">Email Address</label>
                        <input type="email" id="email" required>

                        <div id="cardFields" hidden>
                            

                            <label for="cardNumber">Card Number</label>
                            <input type="text" id="cardNumber">

                            <label for="cvn">CVN</label>
                            <input type="text" id="cvn">

                            <label for="expiry">Expiry Date</label>
                            <input type="text" id="expiry" placeholder="MM/YY">
                        </div>
                    </section>
                </div>

                <div>
                    <section class="payment-section">
                        <h2>Order Summary</h2>

                        <p>Araneta Coliseum</p>
                        <p>Court 1</p>
                        <p>2:00 PM - 3:00 PM</p>

                        <hr>

                        <h3>Total: ₱200.00</h3>
                    </section>

                    <button type="submit" class="pay-button">
                        Pay Now (Demo)
                    </button>

                    <p id="paymentMessage" role="status"></p>
                </div>

            </div>
        </form>
    </main>

    <script src="customScripts/payment.js"></script>
</body>
</html>
